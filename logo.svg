<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="90%" height="90%" class="ccw-badge-logo">
  <defs>
    <!-- Cyan to Purple Outer Border Gradient -->
    <linearGradient id="ccwBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Text & Icon Gradient -->
    <linearGradient id="ccwIconGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="65%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Outer Neon Glow Filter -->
    <filter id="neonBorderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Elements Glow Filter -->
    <filter id="neonElementGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Outer Shadow -->
  <rect x="35" y="35" width="430" height="480" rx="72" fill="none" stroke="url(#ccwBorderGrad)" stroke-width="12" filter="url(#neonBorderGlow)" opacity="0.9" />

  <!-- Main Card Surface -->
  <rect x="35" y="35" width="430" height="480" rx="72" fill="#070d19" stroke="url(#ccwBorderGrad)" stroke-width="10" />

  <!-- Inset Dark Bezel -->
  <rect x="48" y="48" width="404" height="454" rx="60" fill="#040812" opacity="0.6" />

  <!-- 3D Stacked Layers Icon -->
  <g filter="url(#neonElementGlow)">
    <!-- Top Diamond Layer -->
    <polygon points="250,125 340,170 250,215 160,170" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 2nd Layer -->
    <path d="M 160,200 L 250,245 L 340,200" fill="none" stroke="#00d8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 3rd Layer -->
    <path d="M 160,230 L 250,275 L 340,230" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 4th Layer -->
    <path d="M 160,260 L 250,305 L 340,260" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography "CCW" -->
  <text x="250" y="425" 
        text-anchor="middle" 
        font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="105" 
        letter-spacing="3"
        fill="url(#ccwIconGrad)" 
        filter="url(#neonElementGlow)">
    CCW
  </text>
</svg>